[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "npm-format"
name = "NPM Format"
entry = "npm run format"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "npm-check"
name = "NPM Check"
entry = "npm run check"
language = "system"
pass_filenames = false
